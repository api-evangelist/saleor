apis:
- aid: saleor:graphql-api
  name: Saleor GraphQL API
  description: >-
    Single GraphQL endpoint exposing the entire Saleor commerce model - products, variants, categories,
    collections, channels, checkout, orders, payments, promotions, taxes, attributes, warehouses, and
    users. Used by storefronts, the Saleor Dashboard, and installed Apps. Cloud instances expose this
    endpoint at /graphql/ on the API host for the store.
  humanURL: https://docs.saleor.io/api-reference/
  baseURL: https://docs.saleor.io/api-reference/
  tags:
  - GraphQL
  - Commerce
  - Storefront
  - Admin
  properties:
  - type: Documentation
    url: https://docs.saleor.io/api-reference/
  - type: API Usage
    url: https://docs.saleor.io/api-usage/overview
  - url: graphql/saleor-graphql.md
    type: GraphQL
- aid: saleor:app-sdk
  name: Saleor App SDK
  description: >-
    TypeScript SDK for building Saleor Apps - background services that extend Saleor over the GraphQL
    API and react to webhooks. Handles app installation, auth, async webhooks, and metadata.
  humanURL: https://github.com/saleor/saleor-app-sdk
  baseURL: https://github.com/saleor/saleor-app-sdk
  tags:
  - SDK
  - TypeScript
