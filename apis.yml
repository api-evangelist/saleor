- aid: saleor:app-template
  name: Saleor App Template
  description: >-
    Reference Next.js project for bootstrapping a Saleor App - install flow, webhook handlers, GraphQL
    clients, and a config UI mounted inside the Saleor Dashboard via the App Bridge.
  humanURL: https://github.com/saleor/saleor-app-template
  baseURL: https://github.com/saleor/saleor-app-template
